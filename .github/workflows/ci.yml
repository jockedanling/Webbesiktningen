name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SecurityCheck.slnx

      - name: Build
        run: dotnet build SecurityCheck.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test SecurityCheck.slnx --no-build --configuration Release
